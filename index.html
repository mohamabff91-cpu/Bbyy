
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Inspector</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10131c;color:white;
 font-family:Tahoma,Arial;padding:18px
}
.container{max-width:850px;margin:auto}
h2{text-align:center;color:#64a9ff}
.card{
 background:#1b2130;border:1px solid #30394c;
 border-radius:15px;padding:16px;margin:15px 0
}
button,.upload{
 border:0;border-radius:9px;padding:11px 15px;
 background:#2878ed;color:white;cursor:pointer;
 font-size:14px
}
.upload{display:inline-block;margin:5px}
input{display:none}
.file{
 background:#252d3e;padding:12px;
 border-radius:10px;margin:10px 0;
 display:flex;align-items:center;gap:10px;flex-wrap:wrap
}
.file-info{flex:1;min-width:120px;overflow-wrap:anywhere}
.file-info small{display:block;color:#aab6cb;margin-top:7px}
.eye{background:#168d78}
.delete{background:#c44455}
.preview{
 width:65px;height:65px;object-fit:cover;
 border-radius:9px
}
.muted{color:#aab6cb;font-size:13px}
#storage{
 background:#172b36;padding:12px;
 border-radius:10px;color:#8ed8ff;
 font-size:13px;margin:12px 0
}
#viewer{
 display:none;position:fixed;inset:0;
 background:#080b11ee;z-index:5;
 padding:15px;overflow:auto
}
.modal{
 max-width:800px;margin:30px auto;
 background:#1b2130;border:1px solid #3d4b63;
 border-radius:15px;padding:18px
}
pre{
 direction:ltr;text-align:left;white-space:pre-wrap;
 overflow-wrap:anywhere;background:#0d111a;
 padding:15px;border-radius:10px;
 color:#a9e6b0;max-height:55vh;overflow:auto
}
#viewer img{max-width:100%;max-height:400px}
</style>
</head>

<body>
<div class="container">

<h2>🔍 File Inspector</h2>

<div id="storage">
⏳ در حال بررسی حافظه گوشی...
</div>

<div class="card">
<h3>📷 تصاویر</h3>
<p class="muted">حداکثر ۵ تصویر قابل ذخیره است.</p>

<label class="upload">
انتخاب تصاویر +
<input id="images" type="file" accept="image/*" multiple>
</label>

<div id="imageList"></div>
</div>

<div class="card">
<h3>📁 فایل اصلی</h3>
<p class="muted">امکان ذخیره یک فایل با هر فرمتی.</p>

<label class="upload">
انتخاب فایل +
<input id="document" type="file">
</label>

<div id="fileList"></div>
</div>

</div>

<div id="viewer">
<div class="modal">
<h3 id="viewerTitle">بررسی فایل</h3>
<div id="viewerContent"></div>
<button onclick="closeViewer()">بستن</button>
</div>
</div>

<script>
const DB_NAME='FileInspectorDB';
const DB_VERSION=1;
const STORE='files';

let db;
let images=[];
let mainFile=null;
let imageUrls=[];

// اتصال به حافظه دائمی گوشی
function openDatabase(){
 return new Promise((resolve,reject)=>{
  const request=indexedDB.open(DB_NAME,DB_VERSION);

  request.onupgradeneeded=()=>{
   const database=request.result;
   if(!database.objectStoreNames.contains(STORE)){
    database.createObjectStore(STORE,{keyPath:'id'});
   }
  };

  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
 });
}

// عملیات ذخیره و بازیابی
function dbOperation(mode,action,data){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,mode);
  const store=tx.objectStore(STORE);
  let request;

  if(action==='getAll') request=store.getAll();
  if(action==='put') request=store.put(data);
  if(action==='delete') request=store.delete(data);

  tx.oncomplete=()=>resolve(request?.result);
  tx.onerror=()=>reject(tx.error);
  tx.onabort=()=>reject(tx.error);
 });
}

// راه اندازی برنامه
async function initialize(){
 try{
  db=await openDatabase();

  // درخواست اجازه نگهداری پایدار اطلاعات
  if(navigator.storage?.persist){
   try{await navigator.storage.persist();}catch(e){}
  }

  const saved=await dbOperation('readonly','getAll');

  images=saved
   .filter(x=>x.kind==='image')
   .sort((a,b)=>a.lastModified-b.lastModified);

  mainFile=saved.find(x=>x.kind==='document')||null;

  renderImages();
  renderFile();
  updateStorage();

 }catch(error){
  document.getElementById('storage').textContent=
   'خطا در دسترسی به حافظه: '+error.message;
 }
}

function formatSize(bytes){
 if(bytes<1024)return bytes+' B';
 if(bytes<1048576)return (bytes/1024).toFixed(2)+' KB';
 return (bytes/1048576).toFixed(2)+' MB';
}

function createID(){
 return crypto.randomUUID?
  crypto.randomUUID():
  Date.now()+'-'+Math.random();
}

// انتخاب تصاویر
document.getElementById('images').addEventListener('change',async e=>{
 if(!db)return;

 const selected=[...e.target.files];
 const remaining=5-images.length;

 if(selected.length>remaining){
  alert('حداکثر ۵ تصویر مجاز است.');
 }

 try{
  for(const file of selected.slice(0,remaining)){
   const record={
    id:createID(),
    name:file.name,
    type:file.type,
    size:file.size,
    lastModified:file.lastModified,
    kind:'image',
    blob:file
   };

   await dbOperation('readwrite','put',record);
   images.push(record);
  }

  renderImages();
  updateStorage();

 }catch(error){
  alert('ذخیره تصویر انجام نشد. ممکن است حافظه کافی نباشد.');
 }

 e.target.value='';
});

// انتخاب فایل
document.getElementById('document').addEventListener('change',async e=>{
 const file=e.target.files[0];
 if(!file||!db)return;

 try{
  const record={
   id:createID(),
   name:file.name,
   type:file.type,
   size:file.size,
   lastModified:file.lastModified,
   kind:'document',
   blob:file
  };

  // جایگزینی فایل قبلی
  if(mainFile){
   await dbOperation('readwrite','delete',mainFile.id);
  }

  await dbOperation('readwrite','put',record);

  mainFile=record;
  renderFile();
  updateStorage();

 }catch(error){
  alert('ذخیره فایل انجام نشد. فضای ذخیره‌سازی را بررسی کن.');
 }

 e.target.value='';
});

// پاک کردن آدرس های موقت تصاویر
function clearImageUrls(){
 imageUrls.forEach(url=>URL.revokeObjectURL(url));
 imageUrls=[];
}

// نمایش تصاویر
function renderImages(){
 clearImageUrls();

 const list=document.getElementById('imageList');
 list.replaceChildren();

 images.forEach((file,index)=>{
  const div=document.createElement('div');
  div.className='file';

  const url=URL.createObjectURL(file.blob);
  imageUrls.push(url);

  const img=document.createElement('img');
  img.src=url;
  img.className='preview';

  const info=document.createElement('div');
  info.className='file-info';
  info.textContent=file.name;

  const small=document.createElement('small');
  small.textContent=formatSize(file.size);
  info.append(small);

  const eye=document.createElement('button');
  eye.className='eye';
  eye.textContent='👁️';
  eye.onclick=()=>inspectImage(file);

  const del=document.createElement('button');
  del.className='delete';
  del.textContent='حذف';

  del.onclick=async()=>{
   await dbOperation('readwrite','delete',file.id);
   images.splice(index,1);
   renderImages();
   updateStorage();
  };

  div.append(img,info,eye,del);
  list.append(div);
 });
}

// نمایش فایل اصلی
function renderFile(){
 const list=document.getElementById('fileList');
 list.replaceChildren();

 if(!mainFile)return;

 const div=document.createElement('div');
 div.className='file';

 const info=document.createElement('div');
 info.className='file-info';
 info.textContent=mainFile.name;

 const small=document.createElement('small');
 small.textContent=formatSize(mainFile.size)+' | '+(mainFile.type||'نوع ناشناخته');
 info.append(small);

 const eye=document.createElement('button');
 eye.className='eye';
 eye.textContent='👁️';
 eye.onclick=()=>inspectFile(mainFile);

 const del=document.createElement('button');
 del.className='delete';
 del.textContent='حذف';

 del.onclick=async()=>{
  await dbOperation('readwrite','delete',mainFile.id);
  mainFile=null;
  renderFile();
  updateStorage();
 };

 div.append(info,eye,del);
 list.append(div);
}

// نمایش میزان فضای ذخیره شده
async function updateStorage(){
 const total=images.reduce((sum,f)=>sum+f.size,0)
  +(mainFile?mainFile.size:0);

 let extra='';

 if(navigator.storage?.estimate){
  try{
   const data=await navigator.storage.estimate();
   extra='\nفضای استفاده شده سایت: '+formatSize(data.usage||0)+
   '\nظرفیت تخمینی مرورگر: '+formatSize(data.quota||0);
  }catch(e){}
 }

 document.getElementById('storage').textContent=
  '💾 حجم فایل‌های شما: '+formatSize(total)+
  '\nتعداد تصاویر: '+images.length+' از ۵'+
  '\nتعداد فایل اصلی: '+(mainFile?1:0)+' از ۱'+extra;
}

function show(title,content){
 document.getElementById('viewerTitle').textContent=title;

 const area=document.getElementById('viewerContent');
 area.replaceChildren();
 area.append(content);

 document.getElementById('viewer').style.display='block';
}

function closeViewer(){
 document.getElementById('viewer').style.display='none';
}

// بررسی تصویر
async function inspectImage(file){
 const box=document.createElement('div');

 const img=document.createElement('img');
 img.src=URL.createObjectURL(file.blob);

 const info=document.createElement('pre');
 info.textContent='در حال بررسی تصویر...';

 box.append(img,info);
 show('بررسی تصویر',box);

 try{
  const bitmap=await createImageBitmap(file.blob);

  info.textContent=
  'نام: '+file.name+
  '\nفرمت: '+file.type+
  '\nحجم: '+formatSize(file.size)+
  '\nعرض: '+bitmap.width+' پیکسل'+
  '\nارتفاع: '+bitmap.height+' پیکسل';

  bitmap.close();
 }catch{
  info.textContent='اطلاعات تصویر قابل خواندن نیست.';
 }
}

// بررسی ساختار فایل
async function inspectFile(file){
 const box=document.createElement('div');
 const info=document.createElement('pre');

 info.textContent=
 'نام: '+file.name+
 '\nحجم: '+formatSize(file.size)+
 '\nنوع: '+(file.type||'ناشناخته')+
 '\nدر حال بررسی محتوا...';

 box.append(info);
 show('ساختار داخلی فایل',box);

 const ext=file.name.split('.').pop().toLowerCase();

 try{
  if(['txt','json','html','htm','css','js',
  'xml','md','csv','log','svg'].includes(ext)){

   let text=await file.blob.slice(0,1000000).text();

   if(ext==='json'){
    try{text=JSON.stringify(JSON.parse(text),null,2);}
    catch{}
   }

   info.textContent+=
   '\n\nمحتوای داخلی:\n'+text+
   (file.size>1000000?'\nادامه فایل نمایش داده نشده است.':'');
  }
  else{
   const bytes=new Uint8Array(
    await file.blob.slice(0,512).arrayBuffer()
   );

   let hex='',ascii='';

   for(let i=0;i<bytes.length;i++){
    hex+=bytes[i].toString(16).padStart(2,'0')+' ';
    ascii+=(bytes[i]>=32&&bytes[i]<=126)?
     String.fromCharCode(bytes[i]):'.';

    if((i+1)%16===0){
     hex+='\n';
     ascii+='\n';
    }
   }

   info.textContent+=
   '\n\nنمایش باینری HEX:\n'+hex+
   '\n\nنمایش متنی:\n'+ascii+
   '\n\nبرای استخراج کامل ساختار این فرمت، پردازشگر اختصاصی لازم است.';
  }
 }catch(error){
  info.textContent+=' \nخطا: '+error.message;
 }
}

initialize();
</script>
</body>
</html>
